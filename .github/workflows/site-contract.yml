name: Pryntor corporate site checks
on:
  pull_request:
    branches: [main, fix/pryntor-site-compliance-20261018]
    paths:
      - "*.html"
      - "tests/**"
      - ".github/workflows/site-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site-contract:
    name: Static links, privacy and ownership safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run dependency-free static contract
        run: node --test tests/site.test.mjs
