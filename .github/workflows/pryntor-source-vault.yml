name: Source Vault website router check
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/skills/pryntor-source-vault/**'
      - '.claude/skills/pryntor-source-vault/**'
      - '.github/workflows/pryntor-source-vault.yml'
permissions:
  contents: read
jobs:
  router:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate public-only skills and static site unaffected
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          a=Path(".agents/skills/pryntor-source-vault/SKILL.md").read_text()
          b=Path(".claude/skills/pryntor-source-vault/SKILL.md").read_text()
          c=Path("AGENTS.md").read_text()
          for t in (a,b):
              assert "pryntor-source-vault" in t
              assert "COMPANY_ADOPTION.md" in t
              assert "no account" in t.lower()
              assert "not a runtime installation" in t.lower()
          assert "PRY-281" in c
          assert Path("index.html").is_file()
          print("Site research router checks PASS")
          PY
